[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svsg"
version = "5.2.1"
description = "结构化视觉语义网关（SVSG）V5.2.1 生产锁定版"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "httpx>=0.27",
]
llm = ["httpx>=0.27"]
ml = ["ultralytics>=8.2", "opencv-python>=4.9"]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
]

[project.scripts]
svsg = "svsg.__main__:main"

[tool.setuptools.packages.find]
include = ["svsg*"]

[tool.setuptools.package-data]
svsg = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["svsg"]

[tool.mypy]
python_version = "3.11"
files = ["svsg"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
